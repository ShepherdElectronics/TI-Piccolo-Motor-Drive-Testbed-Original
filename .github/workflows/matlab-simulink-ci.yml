name: MATLAB Simulink CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  model-load-check:
    name: Load selected Simulink models
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b

      - name: Run Simulink model load check
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("ci"); check_models()

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-simulink-ci-report
          path: ci_reports/
