name: TI-Piccolo Repository CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repository-structure-check:
    name: Repository structure check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        shell: bash
        run: |
          test -f README.md
          test -f .gitattributes
          test -f .gitignore
          test -f ci/check_models.m
          test -d models
          test -d docs
          test -d scripts

      - name: Verify Simulink Git merge attributes
        shell: bash
        run: |
          grep -q "\*.slx binary merge=mlAutoMerge" .gitattributes
          grep -q "\*.mdl binary merge=mlAutoMerge" .gitattributes

      - name: Verify generated outputs are ignored
        shell: bash
        run: |
          grep -q "ci_reports/" .gitignore
          grep -q "slprj/" .gitignore